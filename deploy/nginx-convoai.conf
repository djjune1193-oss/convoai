# Install: sudo cp deploy/nginx-convoai.conf /etc/nginx/sites-available/convoai
#          sudo ln -s /etc/nginx/sites-available/convoai /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN below, then run certbot (see DEPLOY.md) — it rewrites
# this file to add the HTTPS server block and redirect automatically.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # REST API — backend routes are all under /api/... (see main.py's
    # app.include_router(router, prefix="/api")), so no path rewriting
    # needed here: proxy_pass with no trailing path passes the URI through
    # unchanged.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded profile photos
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # WebSocket — needs the Upgrade/Connection headers and a long read
    # timeout since chat sockets stay open indefinitely.
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Everything else: the built React app
    root /home/YOUR_USER/convoai/frontend/dist;
    index index.html;
    location / {
        try_files $uri /index.html;
    }
}
